name: Build and Release

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build (${{ matrix.os }} - ${{ matrix.backend }})
    runs-on: ${{ matrix.runner }}

    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            runner: windows-latest
            backend: cpu
            torch-pip: "torch torchvision --index-url https://download.pytorch.org/whl/cpu"
            artifact-name: VisualCNN-windows-cpu.exe
            exe-path: dist/VisualCNN.exe

          - os: windows
            runner: windows-latest
            backend: gpu-cuda
            torch-pip: "torch torchvision --index-url https://download.pytorch.org/whl/cu121"
            artifact-name: VisualCNN-windows-gpu-cuda.exe
            exe-path: dist/VisualCNN.exe

          - os: linux
            runner: ubuntu-latest
            backend: cpu
            torch-pip: "torch torchvision --index-url https://download.pytorch.org/whl/cpu"
            artifact-name: VisualCNN-linux-cpu
            exe-path: dist/VisualCNN

          - os: linux
            runner: ubuntu-latest
            backend: gpu-cuda
            torch-pip: "torch torchvision --index-url https://download.pytorch.org/whl/cu121"
            artifact-name: VisualCNN-linux-gpu-cuda
            exe-path: dist/VisualCNN

          - os: macos
            runner: macos-14
            backend: cpu
            torch-pip: "torch torchvision"
            artifact-name: VisualCNN-macos-cpu
            exe-path: dist/VisualCNN

          - os: macos
            runner: macos-14
            backend: gpu-mps
            torch-pip: "torch torchvision"
            artifact-name: VisualCNN-macos-gpu-mps
            exe-path: dist/VisualCNN

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies for Tkinter (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Install Build Dependencies & PyTorch
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install ${{ matrix.torch-pip }}

      - name: Install Application Requirements
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        shell: bash

      - name: Build Executable with PyInstaller
        run: |
          pyinstaller --noconfirm --onefile \
            --collect-all torch \
            --collect-all torchvision \
            --collect-all tkinter \
            --collect-all PIL \
            --collect-all matplotlib \
            --exclude-module torch.testing \
            --exclude-module torch.distributed \
            --exclude-module torch.distributions \
            --exclude-module torch.utils.benchmark \
            --exclude-module torch.utils.mobile_optimizer \
            --exclude-module caffe2 \
            --exclude-module scipy \
            --name "VisualCNN" \
            VisualCNN.py
        shell: bash

      - name: Rename Artifact
        run: |
          mv ${{ matrix.exe-path }} dist/${{ matrix.artifact-name }}
        shell: bash

      - name: Upload Artifact to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-${{ github.sha }}
          name: Release ${{ github.sha }}
          files: dist/${{ matrix.artifact-name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
