name: Build and Release

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build (${{ matrix.os }} - ${{ matrix.backend }})
    runs-on: ${{ matrix.runner }}

    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            runner: windows-latest
            backend: cpu
            torch-pip: "torch torchvision --index-url https://download.pytorch.org/whl/cpu"
            artifact-name: VisualCNN-windows-cpu.exe
            exe-path: dist/VisualCNN.exe

          - os: windows
            runner: windows-latest
            backend: gpu-cuda
            torch-pip: "torch torchvision --index-url https://download.pytorch.org/whl/cu121"
            artifact-name: VisualCNN-windows-gpu-cuda.exe
            exe-path: dist/VisualCNN.exe

          - os: linux
            runner: ubuntu-latest
            backend: cpu
            torch-pip: "torch torchvision --index-url https://download.pytorch.org/whl/cpu"
            artifact-name: VisualCNN-linux-cpu
            exe-path: dist/VisualCNN

          - os: linux
            runner: ubuntu-latest
            backend: gpu-cuda
            torch-pip: "torch torchvision --index-url https://download.pytorch.org/whl/cu121"
            artifact-name: VisualCNN-linux-gpu-cuda
            exe-path: dist/VisualCNN

          - os: macos
            runner: macos-14
            backend: cpu
            torch-pip: "torch torchvision"
            artifact-name: VisualCNN-macos-cpu
            exe-path: dist/VisualCNN

          - os: macos
            runner: macos-14
            backend: gpu-mps
            torch-pip: "torch torchvision"
            artifact-name: VisualCNN-macos-gpu-mps
            exe-path: dist/VisualCNN

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies for Tkinter (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Install Build Dependencies & PyTorch
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install ${{ matrix.torch-pip }}

      - name: Install Application Requirements
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        shell: bash

      - name: Build Executable with PyInstaller
        run: |
          pyinstaller --noconfirm --onefile \
            --collect-all torch \
            --collect-all torchvision \
            --collect-all tkinter \
            --collect-all PIL \
            --collect-all matplotlib \
            --exclude-module torch.testing \
            --exclude-module torch.distributed \
            --exclude-module torch.distributions \
            --exclude-module torch.utils.benchmark \
            --exclude-module torch.utils.mobile_optimizer \
            --exclude-module torch.utils.tensorboard \
            --exclude-module torch.utils.bottleneck \
            --exclude-module torch.utils.flops_counter \
            --exclude-module torch.onnx \
            --exclude-module torch.profiler \
            --exclude-module torch.fx \
            --exclude-module torch.ao \
            --exclude-module torch.quantization \
            --exclude-module torch.compiler \
            --exclude-module torch._dynamo \
            --exclude-module torch._export \
            --exclude-module torch.sparse \
            --exclude-module torch.nested \
            --exclude-module torch.masked \
            --exclude-module torch.signal \
            --exclude-module torch.special \
            --exclude-module torch.fft \
            --exclude-module torch.cuda.nvtx \
            --exclude-module torch.cuda.jitrng \
            --exclude-module torchvision.models \
            --exclude-module torchvision.io \
            --exclude-module caffe2 \
            --exclude-module scipy \
            --exclude-module triton \
            --exclude-module sympy \
            --exclude-module setuptools \
            --exclude-module matplotlib.backends.backend_qt5agg \
            --exclude-module matplotlib.backends.backend_qt6agg \
            --exclude-module matplotlib.backends.backend_gtk3agg \
            --exclude-module matplotlib.backends.backend_wxagg \
            --exclude-module matplotlib.tests \
            --exclude-module mpl_toolkits.mplot3d \
            --exclude-module numpy.tests \
            --exclude-module unittest \
            --exclude-module doctest \
            --exclude-module pydoc \
            --exclude-module distutils \
            --exclude-module IPython \
            --exclude-module jupyter \
            --name "VisualCNN" \
            VisualCNN.py
        shell: bash
      
      - name: Strip Linux CUDA Shared Libraries & Symbols
        if: runner.os == 'Linux' && matrix.backend == 'gpu-cuda'
        run: |
          echo "Cleaning up heavy CUDA shared objects for Linux..."
          # Unpack executable temporary directory if PyInstaller placed them, or target extracted libs
          # Note: If running --onedir, strip directly from dist/VisualCNN/torch/lib/
          
          # Install strip utility
          sudo apt-get install -y binutils

          # Target PyTorch site-packages before pyinstaller OR build folder
          PYTORCH_LIB=$(python -c "import torch, os; print(os.path.join(os.path.dirname(torch.__file__), 'lib'))")
          
          # Remove training-only cuDNN, NVRTC, CUPTI, and JIT linking binaries
          rm -f $PYTORCH_LIB/libcudnn_cnn_train*.so*
          rm -f $PYTORCH_LIB/libnvrtc*.so*
          rm -f $PYTORCH_LIB/libnvjitlink*.so*
          rm -f $PYTORCH_LIB/libcupti*.so*
          rm -f $PYTORCH_LIB/libcusparse*.so*

          # Strip debug symbols from all remaining .so files
          find $PYTORCH_LIB -name "*.so*" -exec strip --strip-debug {} + || true
        shell: bash

      - name: Strip Windows CUDA Dynamic Link Libraries (.dll)
        if: runner.os == 'Windows' && matrix.backend == 'gpu-cuda'
        run: |
          Write-Host "Cleaning up heavy CUDA DLLs for Windows..."
          $PYTORCH_LIB = python -c "import torch, os; print(os.path.join(os.path.dirname(torch.__file__), 'lib'))"
          
          # Remove training cuDNN, NVRTC, CUPTI, and JIT linking DLLs
          Remove-Item -Path "$PYTORCH_LIB\cudnn_cnn_train*.dll" -ErrorAction SilentlyContinue
          Remove-Item -Path "$PYTORCH_LIB\nvrtc*.dll" -ErrorAction SilentlyContinue
          Remove-Item -Path "$PYTORCH_LIB\nvjitlink*.dll" -ErrorAction SilentlyContinue
          Remove-Item -Path "$PYTORCH_LIB\cupti*.dll" -ErrorAction SilentlyContinue
          Remove-Item -Path "$PYTORCH_LIB\cusparse*.dll" -ErrorAction SilentlyContinue
        shell: powershell

      - name: Rename Artifact
        run: |
          mv ${{ matrix.exe-path }} dist/${{ matrix.artifact-name }}
        shell: bash
        
      - name: Archive Artifact
        run: |
          cd dist
          if [ "${{ matrix.os }}" = "windows" ]; then
            7z a ${{ matrix.artifact-name }}.zip ${{ matrix.artifact-name }}
            echo "ARCHIVE_NAME=${{ matrix.artifact-name }}.zip" >> $GITHUB_ENV
          else
            tar -czvf ${{ matrix.artifact-name }}.tar.gz ${{ matrix.artifact-name }}
            echo "ARCHIVE_NAME=${{ matrix.artifact-name }}.tar.gz" >> $GITHUB_ENV
          fi
        shell: bash

      - name: Upload Artifact to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-${{ github.sha }}
          name: Release ${{ github.sha }}
          files: dist/${{ matrix.artifact-name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
